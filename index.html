function isChineseVoice(v){return /^zh([-_]|$)/i.test(v.lang)}
function scoreVoice(v){return (/zh[-_](TW|Hant)/i.test(v.lang)?30:0)+(/Hsiao|Xiaoxiao|Huihui|Hanhan|Mei|Female|女|曉|美佳/i.test(v.name)?20:0)+(/Natural|Online|Enhanced/i.test(v.name)?10:0)}
function defaultVoice(){return [...voices].filter(isChineseVoice).sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0]}
function refreshVoices(){if(!('speechSynthesis'in window))return;voices=window.speechSynthesis.getVoices();const list=voices.filter(isChineseVoice).sort((a,b)=>scoreVoice(b)-scoreVoice(a));const select=$('voiceSelect');if(!select)return;select.replaceChildren();const auto=new Option('✨ 自動選擇中文聲音','');select.add(auto);list.forEach(v=>select.add(new Option(`${v.name} (${v.lang})`,v.voiceURI)));if(voiceName&&!list.some(v=>v.voiceURI===voiceName)){select.add(new Option('原本的聲音已無法使用（改成自動）','missing'));voiceName='';save()}select.value=voiceName||'';$('voiceNote').textContent=list.length?`這台裝置找到 ${list.length} 種中文聲音。可以逐一試聽，設定會自動儲存。不同裝置可能使用不同聲線。`:'目前找不到中文聲音。你可以試試 Edge 或在 Windows 安裝繁體中文語音，再重新開啟遊戲。'}
function say(t){if(!sound||!('speechSynthesis'in window))return;const synth=window.speechSynthesis;synth.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=rate;u.pitch=pitch;u.volume=1;const selected=voices.find(v=>v.voiceURI===voiceName);const preferred=selected||defaultVoice();if(preferred)u.voice=preferred;synth.speak(u)}

$('resetVoice').addEventListener('click',()=>{voiceName='';pitch=1.25;rate=1.05;$('voiceSelect').value='';$('pitchRange').value=pitch;$('rateRange').value=rate;$('pitchValue').value=pitch.toFixed(2);$('rateValue').value=rate.toFixed(2);save();say('我們一起玩數字吧！')});

function chime(){if(!sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime+.02;[[659.25,0,.16],[830.61,.14,.16],[1046.5,.29,.32]].forEach(([freq,offset,dur])=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,t+offset);gain.gain.setValueAtTime(.0001,t+offset);gain.gain.exponentialRampToValueAtTime(.19,t+offset+.025);gain.gain.exponentialRampToValueAtTime(.0001,t+offset+dur);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t+offset);osc.stop(t+offset+dur+.02)})}catch(e){console.warn('此瀏覽器無法播放獎勵音效',e)}}function promptText(){return questionKind==='number'?`請找到數字 ${correct}`:`請數一數，有幾個${currentEmoji==='🍓'?'草莓':currentEmoji==='🐟'?'小魚':currentEmoji==='🌼'?'花朵':currentEmoji==='⭐'?'星星':currentEmoji==='🍎'?'蘋果':'蝴蝶'}？`;}function showAsset(){const img=$('bearAsset');img.onload=()=>{img.classList.remove('hidden');$('bearPlaceholder').classList.add('hidden')};img.onerror=()=>{img.classList.add('hidden');$('bearPlaceholder').classList.remove('hidden')}}function render(){answered=false;correct=order[index];questionKind=mode==='mix'?(index%2?'count':'number'):mode;currentEmoji=items[(index+correct)%items.length];$('speech').textContent='你找得到嗎？';$('subSpeech').textContent='慢慢看，點一個答案';$('question').textContent=promptText();$('bigNumber').classList.toggle('hidden',questionKind!=='number');$('things').classList.toggle('hidden',questionKind!=='count');$('bigNumber').textContent=correct;$('things').replaceChildren();if(questionKind==='count'){if(correct===0){const el=document.createElement('span');el.className='zero';el.textContent='空空的';$('things').append(el)}for(let i=0;i<correct;i++){const el=document.createElement('span');el.className='thing';el.textContent=currentEmoji;el.style.animationDelay=i*45+'ms';$('things').append(el)}}const others=shuffle(Array.from({length:11},(_,i)=>i).filter(n=>n!==correct)).slice(0,5);options=shuffle([correct,...others]);$('answers').replaceChildren();options.forEach(n=>{const b=document.createElement('button');b.className='answer';b.textContent=n;b.setAttribute('aria-label','數字 '+n);b.addEventListener('click',()=>choose(n,b));$('answers').append(b)});$('feedback').textContent='';$('nextBtn').classList.add('hidden');$('stars').textContent='⭐ '+stars;$('round').textContent=`第 ${index+1} / 11 題`;$('fill').style.width=(index/11*100)+'%';[['number','tabNumber'],['count','tabCount'],['mix','tabMix']].forEach(([val,id])=>$(id).setAttribute('aria-selected',String(mode===val)));save()}let advanceTimer=null;
function choose(n,b){
  let delay=1450;
  if(answered)return;
  answered=true;
  document.querySelectorAll('.answer').forEach(btn=>btn.disabled=true);
  if(n===correct){
    stars++;$('stars').textContent='⭐ '+stars;save();
    b.classList.add('good');
    $('feedback').textContent='🎉 答對了！你真棒！';
    $('speech').textContent='太棒了！';
    $('subSpeech').textContent='桃桃熊送你一顆星星 ⭐';
    $('bear').classList.remove('celebrate');void $('bear').offsetWidth;$('bear').classList.add('celebrate');
    chime();
    // 先播放音效，之後用簡短鼓勵語；下一題不必再點按鈕。
    if(useSample&&sound){
      if('speechSynthesis'in window)window.speechSynthesis.cancel();
      stopSample();
      sampleAudio.play().catch(()=>say('耶！答對啦！'));
      delay=Math.max(1450,Math.ceil((Number.isFinite(sampleAudio.duration)?sampleAudio.duration:4.05)*1000)+200);
    } else {setTimeout(()=>{if(answered)say('耶！答對啦！')},480)}
  }else{
    b.classList.add('bad');
    $('feedback').textContent=`💗 正確答案是 ${correct}，我們繼續玩！`;
    $('speech').textContent='沒關係，繼續加油！';
    $('subSpeech').textContent=`正確答案：${correct}`;
    [...$('answers').children].find(btn=>Number(btn.textContent)===correct)?.classList.add('good');
    say('沒關係！繼續加油！');
  }
  $('nextBtn').classList.add('hidden');
  clearTimeout(advanceTimer);
  advanceTimer=setTimeout(()=>{advanceTimer=null;next()},delay);
}
function finish(){const el=$('question');el.textContent='🎉 恭喜完成 0～10 挑戰！';$('bigNumber').classList.remove('hidden');$('bigNumber').textContent='🏆';$('things').classList.add('hidden');$('answers').replaceChildren();$('feedback').textContent='桃桃熊為你鼓掌！再玩一次吧！';$('speech').textContent='你是數字小高手！';$('subSpeech').textContent=`目前累積 ${stars} 顆星星`;index=0;order=shuffle(Array.from({length:11},(_,i)=>i));save();$('round').textContent='全部完成';$('fill').style.width='100%';$('nextBtn').textContent='再玩一次 🎈';$('nextBtn').classList.remove('hidden');$('nextBtn').dataset.finished='yes';say('恭喜完成！你是數字小高手！')}function next(){stopSample();clearTimeout(advanceTimer);advanceTimer=null;if($('nextBtn').dataset.finished==='yes'){$('nextBtn').dataset.finished='';render();return}index++;if(index>=11){finish();return}render()}$('nextBtn').addEventListener('click',next);$('restartBtn').addEventListener('click',()=>{stopSample();clearTimeout(advanceTimer);advanceTimer=null;if('speechSynthesis'in window)window.speechSynthesis.cancel();index=0;order=Array.from({length:11},(_,i)=>i);$('nextBtn').dataset.finished='';render()});$('hearBtn').addEventListener('click',()=>say(promptText()));$('soundBtn').addEventListener('click',()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊 聲音開':'🔇 聲音關';$('soundBtn').setAttribute('aria-pressed',String(sound));if(!sound){stopSample();if('speechSynthesis'in window)window.speechSynthesis.cancel()}save()});[['number','tabNumber'],['count','tabCount'],['mix','tabMix']].forEach(([val,id])=>$(id).addEventListener('click',()=>{stopSample();clearTimeout(advanceTimer);advanceTimer=null;mode=val;index=0;order=Array.from({length:11},(_,i)=>i);$('nextBtn').dataset.finished='';render()}));$('soundBtn').textContent=sound?'🔊 聲音開':'🔇 聲音關';showAsset();render()})();
</script></body></html>
